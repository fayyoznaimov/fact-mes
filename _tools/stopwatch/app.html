<title>Учёт простоев цеха</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --page: #f4f3ef;
  --surface: #fcfcfb;
  --surface-2: #f0efea;
  --ink: #14130f;
  --ink-2: #52514e;
  --ink-muted: #898781;
  --hair: #e1e0d9;
  --rule: #c3c2b7;
  --accent: #2a78d6;
  --good: #0ca30c;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  --radius: 3px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #232321;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-muted: #898781;
    --hair: #2c2c2a;
    --rule: #383835;
    --accent: #3987e5;
    --good: #0ca30c;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
  }
}
:root[data-theme="dark"] {
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #232321;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --ink-muted: #898781;
  --hair: #2c2c2a;
  --rule: #383835;
  --accent: #3987e5;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --s4: #c98500;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: "IBM Plex Sans", system-ui, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.45;
}
.mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 20px 60px; display: flex; flex-direction: column; gap: 20px; }

header.bar { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); padding-bottom: 12px; }
header.bar h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--ink-2); font-size: 13px; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: middle; }
.dot.stale { background: var(--warning); }
.dot.err { background: var(--critical); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--hair); border: 1px solid var(--hair); }
.tile { background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.tile .label { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
.tile .value { font-size: 26px; font-weight: 600; line-height: 1.1; }
.tile .value small { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.tile.alarm .value { color: var(--critical); }

section h2 { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 10px; font-weight: 600; }

/* карта цеха */
.floor { display: flex; flex-direction: column; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.floor-row { display: flex; gap: 6px; align-items: center; }
.row-label { width: 22px; flex: none; color: var(--ink-muted); font-size: 11px; text-align: right; }
.cell { width: 74px; flex: none; }
.loom {
  width: 74px; padding: 6px 7px; background: var(--surface); border: 1px solid var(--hair);
  border-left: 3px solid var(--good); cursor: pointer; text-align: left; color: inherit;
  font: inherit; display: block;
}
.loom:hover { border-color: var(--rule); }
.loom:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.loom .nm { font-weight: 600; font-size: 13px; }
.loom .st { font-size: 11px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.loom.auto { border-left-color: var(--warning); }
.loom.manual { border-left-color: var(--critical); background: color-mix(in srgb, var(--critical) 7%, var(--surface)); }
.loom.long { border-left-color: var(--critical); }

.legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--ink-2); font-size: 12px; margin-top: 8px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 3px; margin-right: 6px; vertical-align: middle; }
.lg-run::before { background: var(--good); }
.lg-auto::before { background: var(--warning); }
.lg-man::before { background: var(--critical); }

/* тикеты */
table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--hair); }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--hair); vertical-align: middle; }
th { font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-muted); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: "IBM Plex Mono", monospace; }
tbody tr:last-child td { border-bottom: none; }
.pill { display: inline-block; padding: 1px 7px; border: 1px solid var(--rule); border-radius: 999px; font-size: 11px; color: var(--ink-2); }
.pill.crit { border-color: var(--critical); color: var(--critical); }
.btn {
  font: inherit; font-size: 12px; padding: 4px 10px; background: var(--surface-2);
  border: 1px solid var(--rule); color: var(--ink); cursor: pointer; border-radius: var(--radius);
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.empty { color: var(--ink-muted); padding: 14px; background: var(--surface); border: 1px dashed var(--hair); }

/* сводка */
.bars { display: flex; flex-direction: column; gap: 7px; }
.bar-row { display: grid; grid-template-columns: 160px 1fr 74px; gap: 10px; align-items: center; }
.bar-track { background: var(--surface-2); height: 14px; position: relative; }
.bar-fill { height: 100%; }
.bar-row .cap { font-size: 13px; color: var(--ink-2); }
.bar-row .val { text-align: right; font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-size: 13px; }

/* диалог */
dialog { border: 1px solid var(--rule); background: var(--surface); color: var(--ink); padding: 0; max-width: 460px; width: 92vw; }
dialog::backdrop { background: rgba(0,0,0,.45); }
.dlg-head { padding: 14px 16px; border-bottom: 1px solid var(--hair); }
.dlg-head h3 { margin: 0; font-size: 16px; }
.dlg-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.cats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.cat { text-align: left; padding: 8px 10px; background: var(--surface-2); border: 1px solid var(--hair); cursor: pointer; font: inherit; color: inherit; }
.cat:hover { border-color: var(--accent); }
.cat[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.cat .k { display: block; font-size: 11px; color: var(--ink-muted); }
input[type=text], textarea { font: inherit; width: 100%; padding: 7px 9px; background: var(--page); color: var(--ink); border: 1px solid var(--rule); border-radius: var(--radius); }
.dlg-foot { padding: 12px 16px; border-top: 1px solid var(--hair); display: flex; justify-content: flex-end; gap: 8px; }
.note { color: var(--ink-muted); font-size: 12px; }
</style>

<div class="wrap">
  <header class="bar">
    <h1>Учёт простоев цеха</h1>
    <div class="sub"><span id="live-dot" class="dot"></span><span id="live-text">загрузка…</span></div>
    <div class="sub mono" id="shift-text"></div>
  </header>

  <div class="tiles" id="tiles"></div>

  <section>
    <h2>Карта цеха</h2>
    <div class="floor" id="floor"></div>
    <div class="legend">
      <span class="lg-run">работает</span>
      <span class="lg-auto">обрыв (станок определил сам)</span>
      <span class="lg-man">ручной останов — нужна причина</span>
    </div>
  </section>

  <section>
    <h2>Остановы без причины</h2>
    <div id="tickets"></div>
  </section>

  <section>
    <h2>Причины простоев за сутки</h2>
    <div class="bars" id="report"></div>
  </section>
</div>

<dialog id="dlg">
  <form method="dialog">
    <div class="dlg-head">
      <h3 id="dlg-title">Станок</h3>
      <div class="note mono" id="dlg-meta"></div>
    </div>
    <div class="dlg-body">
      <div class="cats" id="dlg-cats"></div>
      <label>Кто заполнил
        <input type="text" id="dlg-who" placeholder="Фамилия или табельный номер" autocomplete="off">
      </label>
      <label>Комментарий
        <input type="text" id="dlg-comment" placeholder="Например: замена челнока" autocomplete="off">
      </label>
    </div>
    <div class="dlg-foot">
      <button class="btn" value="cancel">Отмена</button>
      <button class="btn primary" id="dlg-save" value="save">Сохранить причину</button>
    </div>
  </form>
</dialog>

<script>
const SERIES = ["--s1", "--s2", "--s3", "--s4"];
let state = null, current = null, chosen = null;

const fmtDur = s => {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h} ч ${String(m).padStart(2, "0")} мин` : `${m} мин`;
};
const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }) : "—";

async function load() {
  try {
    const [s, r] = await Promise.all([
      fetch("/api/state").then(x => x.json()),
      fetch("/api/report").then(x => x.json()),
    ]);
    state = s;
    render(s, r);
  } catch (e) {
    document.getElementById("live-text").textContent = "нет связи со службой учёта";
    document.getElementById("live-dot").className = "dot err";
  }
}

function render(s, rep) {
  const dot = document.getElementById("live-dot"), txt = document.getElementById("live-text");
  if (s.error) { dot.className = "dot err"; txt.textContent = "FACT не отвечает: " + s.error; }
  else if (!s.updated_at) { dot.className = "dot stale"; txt.textContent = "первый опрос…"; }
  else {
    const age = (Date.now() - new Date(s.updated_at)) / 1000;
    dot.className = "dot" + (age > 180 ? " stale" : "");
    txt.textContent = "данные от " + fmtTime(s.updated_at);
  }
  document.getElementById("shift-text").textContent = s.shift ? "смена " + s.shift : "";

  const looms = s.looms || [];
  const stopped = looms.filter(l => !l.running);
  const manual = stopped.filter(l => ["Manual", "Machine_failure", "Power_off", "Unknown"].includes(l.state));
  const lost = (s.open_tickets || []).reduce((a, t) => a + (t.duration_sec || 0), 0);
  const unclassified = (s.open_tickets || []).filter(t => !t.category_id).length + (s.unclassified_recent || []).length;

  document.getElementById("tiles").innerHTML = [
    tile("Работает", `${looms.length - stopped.length}<small> / ${looms.length}</small>`),
    tile("Стоит", String(stopped.length), stopped.length > 0),
    tile("Ручные остановы", String(manual.length), manual.length > 0),
    tile("Потеряно сейчас", fmtDur(lost)),
    tile("Ждут причины", String(unclassified), unclassified > 0),
  ].join("");

  // карта цеха
  const rows = {};
  looms.forEach(l => { if (l.row != null) (rows[l.row] ||= []).push(l); });
  document.getElementById("floor").innerHTML = Object.keys(rows).sort((a, b) => a - b).map(r => {
    const byCol = {}; rows[r].forEach(l => byCol[l.col] = l);
    const cols = Object.keys(byCol).map(Number);
    const max = Math.max(...cols);
    let cells = "";
    for (let c = Math.min(...cols); c <= max; c++) {
      const l = byCol[c];
      cells += l ? loomCell(l) : `<div class="cell"></div>`;
    }
    return `<div class="floor-row"><div class="row-label mono">${r}</div>${cells}</div>`;
  }).join("");

  // остановы без причины
  const open = (s.open_tickets || []).map(t => ({ ...t, live: true }));
  const all = open.concat(s.unclassified_recent || []);
  const el = document.getElementById("tickets");
  if (!all.length) {
    el.innerHTML = `<div class="empty">Все остановы разобраны — новых тикетов нет.</div>`;
  } else {
    el.innerHTML = `<table><thead><tr>
      <th>Станок</th><th>Начался</th><th class="num">Длится</th><th>Станок сказал</th><th>Артикул</th><th></th>
    </tr></thead><tbody>` + all.map(t => `<tr>
      <td><strong>${t.loom}</strong></td>
      <td class="mono">${fmtTime(t.started_at)}</td>
      <td class="num">${fmtDur(t.duration_sec)}</td>
      <td><span class="pill ${t.live ? "crit" : ""}">${(s.cause_ru || {})[t.fact_cause] || t.fact_cause || "—"}${t.live ? " · идёт" : ""}</span></td>
      <td>${t.style || "—"}</td>
      <td style="text-align:right"><button class="btn" data-ticket="${t.id}">Указать причину</button></td>
    </tr>`).join("") + `</tbody></table>`;
  }

  // сводка причин
  const cats = (rep.by_category || []).filter(c => c.minutes > 0);
  const maxMin = Math.max(1, ...cats.map(c => c.minutes));
  document.getElementById("report").innerHTML = cats.length ? cats.map((c, i) => `
    <div class="bar-row">
      <div class="cap">${c.name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${100 * c.minutes / maxMin}%;background:var(${c.id === "__none__" ? "--ink-muted" : SERIES[i % SERIES.length]})"></div></div>
      <div class="val">${c.minutes} мин</div>
    </div>`).join("") : `<div class="empty">Пока нет закрытых остановов за сутки.</div>`;

  document.querySelectorAll("[data-ticket]").forEach(b =>
    b.onclick = () => openDialog(all.find(t => String(t.id) === b.dataset.ticket)));
}

function tile(label, value, alarm) {
  return `<div class="tile${alarm ? " alarm" : ""}"><div class="label">${label}</div><div class="value">${value}</div></div>`;
}

function loomCell(l) {
  const manualish = ["Manual", "Machine_failure", "Power_off", "Unknown"].includes(l.state);
  const cls = l.running ? "" : (manualish ? " manual" : " auto") + (l.state_sec > 900 ? " long" : "");
  const status = l.running ? `${l.rpm} об/мин` : `${l.cause_ru} · ${fmtDur(l.state_sec)}`;
  return `<div class="cell"><button class="loom${cls}" data-loom="${l.loom}" title="${l.loom} · ${l.style} · ${status}">
    <span class="nm">${l.loom}</span><span class="st">${status}</span></button></div>`;
}

function openDialog(t) {
  if (!t) return;
  current = t; chosen = null;
  document.getElementById("dlg-title").textContent = `${t.loom} — причина простоя`;
  document.getElementById("dlg-meta").textContent =
    `с ${fmtTime(t.started_at)} · ${fmtDur(t.duration_sec)} · станок сказал: ${(state.cause_ru || {})[t.fact_cause] || t.fact_cause || "—"}`;
  document.getElementById("dlg-cats").innerHTML = (state.categories || []).map(c =>
    `<button type="button" class="cat" data-cat="${c.id}" aria-pressed="false">${c.name}<span class="k">${c.kind}</span></button>`).join("");
  document.querySelectorAll(".cat").forEach(b => b.onclick = () => {
    chosen = b.dataset.cat;
    document.querySelectorAll(".cat").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  });
  document.getElementById("dlg-comment").value = "";
  document.getElementById("dlg").showModal();
}

document.getElementById("dlg").addEventListener("close", async ev => {
  const dlg = document.getElementById("dlg");
  if (dlg.returnValue !== "save" || !current || !chosen) return;
  await fetch(`/api/ticket/${current.id}/classify`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      category_id: chosen,
      who: document.getElementById("dlg-who").value,
      comment: document.getElementById("dlg-comment").value,
    }),
  });
  load();
});

load();
setInterval(load, 20000);
</script>
