<title>Карточки станков</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Карточки станков — тот же язык, что приложение (ISA-101): серый спокойный фон,
   цвет только у отклонений. Стоящий станок — красная полоса и плашка времени. */
:root{
  --bg:#e8ecf0; --card:#fff; --rule:#dde2e8; --rule-2:#c3cbd4; --ink:#151d26; --ink-2:#3f4b58; --muted:#6a7582;
  --run:#2e7d4f; --stop:#c62828; --warn:#a36f00; --chrome:#1d2631; --accent:#1f5fa8;
  --font:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--font)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap;padding:10px 18px;
  background:var(--card);border-bottom:1px solid var(--rule-2)}
h1{margin:0;font-size:18px;font-weight:600}
.sub{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
header label{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
select{font:inherit;font-size:13px;min-height:32px;padding:4px 8px;border:1px solid var(--rule-2);border-radius:4px;background:var(--card);color:var(--ink)}
.counts{display:flex;margin-left:auto;flex-wrap:wrap;border:1px solid var(--rule);border-radius:4px;background:var(--card)}
.count{padding:6px 14px;border-right:1px solid var(--rule);min-width:90px}
.count:last-child{border-right:0}
.count b{display:block;font-size:20px;line-height:1.15;font-weight:600;font-variant-numeric:tabular-nums}
.count span{font-size:11px;color:var(--muted)}
.count.stop b{color:var(--stop)}
main{padding:14px 18px 30px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--rule-2);border-radius:4px;
  padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card.stop{border-left-color:var(--stop)}
.card.wait{box-shadow:inset 0 0 0 1px var(--stop)}
.top{display:flex;align-items:center;gap:10px}
.name{font-size:24px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
.bad{color:var(--stop);font-weight:600}
.model{font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{margin-left:auto;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.card.run .status{color:var(--run)} .card.run .status::before{background:var(--run)}
.card.stop .status{color:#fff;background:var(--stop);padding:3px 8px;border-radius:4px}
.card.stop .status::before{background:#fff}
.alert{font-size:13px;font-weight:600;color:var(--stop)}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:13px}
dt{color:var(--muted)}
dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
dd small{color:var(--muted)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.kpi div{padding:6px 0 5px}
.kpi div + div{padding-left:10px;border-left:1px solid var(--rule)}
.kpi b{display:block;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--muted)}
.stops{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:12px;color:var(--muted)}
.stops b{display:block;color:var(--ink);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.out{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.out b{color:var(--ink);font-weight:600}
footer{padding:8px 18px 18px;color:var(--muted);font-size:12px;max-width:120ch}
a{color:var(--accent)}
@media (max-width:600px){.counts{margin-left:0}}
</style>

<header>
  <h1>Карточки станков</h1>
  <div class="sub" id="head-sub">—</div>
  <label>Показывать <select id="ticket-filter"><option value="all">все станки</option><option value="waiting">ожидают тикета</option></select></label>
  <div class="counts">
    <div class="count run"><b id="c-run">—</b><span>работает</span></div>
    <div class="count stop"><b id="c-stop">—</b><span>стоит</span></div>
    <div class="count"><b id="c-op">—</b><span>с оператором</span></div>
    <div class="count"><b id="c-picks">—</b><span>тыс. пиков</span></div>
    <div class="count"><b id="c-avg-rpm">—</b><span>средние об/мин, цех</span></div>
    <div class="count"><b id="c-avg-output">—</b><span>полотенец в час на станок</span></div>
    <div class="count"><b id="c-avg-eff">—</b><span>КПД смены, цех</span></div>
  </div>
</header>

<main><div class="grid" id="grid"></div></main>
<footer id="foot"></footer>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const REFRESH = 20000;
const Q = new URLSearchParams(location.search);
const DAY = (Q.get("day") || "").trim();
const SHIFT = (Q.get("shift") || "").trim().toUpperCase();
const ZONE = (Q.get("zone") || "").trim().toUpperCase();
const PICK = (Q.get("looms") || "").trim().toUpperCase();

const parts = s => s.match(/^([A-Z]+)(\d+)$/) || [];
function inZone(loom) {
  const name = (loom || "").toUpperCase();
  if (ZONE && !name.startsWith(ZONE)) return false;
  if (!PICK) return true;
  return PICK.split(",").some(item => {
    const [from, to] = item.split("-").map(x => x.trim());
    if (!to) return name === from;
    const a = parts(from), b = parts(to), c = parts(name);
    return a[1] && c[1] === a[1] && b[1] === a[1] && +c[2] >= +a[2] && +c[2] <= +b[2];
  });
}

const nf = (x, d = 0) => (x == null || x === "") ? "-"
  : Number(x).toLocaleString("ru-RU", {minimumFractionDigits: d, maximumFractionDigits: d});
const dash = v => (v == null || v === "") ? "-" : v;

// Остаток меньше нуля — счётчик станка ушёл за заданную длину навоя: навой
// сработан или длина введена неверно. «−2 114 м» на карточке ничего не говорит.
const beamLeft = r => r.remaining_m == null ? "—" : r.remaining_m < 0
  ? `<span class="bad">сработан</span> <small>счётчик за длиной навоя на ${nf(-r.remaining_m)} м</small>`
  : `${nf(r.remaining_m)} м${r.beam_length_m ? ` <small>из ${nf(r.beam_length_m)}</small>` : ""}`;
const hm = m => m == null ? "—" : m >= 60 ? `${Math.floor(m / 60)} ч ${m % 60} мин` : `${m} мин`;
function card(r) {
  const st = r.state === "run" ? "run" : r.state === "stop" ? "stop" : "none";
  const status = st === "run" ? "Работает" : st === "stop" ? `Стоит ${hm(r.state_min)}` : "Нет данных";
  const op = r.operator;
  return `<div class="card ${st}${r.awaiting_ticket ? " wait" : ""}">
    <div class="top">
      <span class="name">${esc(r.label)}</span>
      <span class="model">${esc(r.model || "")}</span>
      <span class="status">${status}</span>
    </div>
    ${r.awaiting_ticket ? '<div class="alert">Ждёт тикета: стоит без причины</div>' : ""}
    <dl>
      ${st === "stop" ? `<dt>Причина</dt><dd>${esc(r.cause_ru || "—")}</dd>` : ""}
      ${r.ticket ? `<dt>Тикет</dt><dd>${esc(r.ticket.ru)}</dd>` : ""}
      <dt>Оператор</dt><dd>${op ? `${esc(op.name)}${op.code ? " " + esc(op.code) : ""}${op.source === "FACT" ? " <small>из FACT</small>" : ""}` : "—"}</dd>
      <dt>Дизайн</dt><dd>${esc(dash(r.design))}</dd>
      <dt>Ткань</dt><dd>${esc(dash(r.cloth_name))}</dd>
      <dt>Остаток основы</dt><dd>${beamLeft(r)}</dd>
    </dl>
    <div class="kpi">
      <div><b>${nf(r.efficiency_pct,1)}%</b><span>КПД смены</span></div>
      <div><b>${nf(r.rpm)}</b><span>об/мин сейчас</span></div>
      <div><b>${nf(r.stop_min,0)}</b><span>мин простоя · ${nf(r.stops_total)} ост.</span></div>
    </div>
    <div class="stops">
      <span>Уток<b>${nf(r.weft_ct)} · ${nf(r.weft_stop_min,0)} мин</b></span>
      <span>Основа<b>${nf(r.warp_g_ct)} · ${nf(r.warp_stop_min,0)} мин</b></span>
      <span>Ворс<b>${nf(r.warp_p_ct)} · ${nf(r.pile_stop_min,0)} мин</b></span>
    </div>
    <div class="out">
      <span>Пиков <b>${nf(r.picks_total,1)} тыс.</b></span>
      <span>Полотенец <b>${nf(r.towels)}</b>${r.panels > 1 ? ` (${nf(r.rows_woven)} × ${r.panels})` : ""}</span>
      <span>A <b>${nf(r.shift_a,1)}</b> B <b>${nf(r.shift_b,1)}</b> C <b>${nf(r.shift_c,1)}</b></span>
    </div>
  </div>`;
}

async function load() {
  try {
    const url = "/api/cards" + (DAY ? `?day=${encodeURIComponent(DAY)}` : "?")
      + (SHIFT ? `&shift=${encodeURIComponent(SHIFT)}` : "");
    const response = await fetch(url);
    const d = await response.json();
    if (!response.ok) throw new Error(d.error || `HTTP ${response.status}`);
    // Средние всего цеха не меняются при фильтрации карточек ожидания тикета.
    const mean = field => {
      const values = d.rows.filter(r => r.stops_total != null).map(r => r[field] ?? 0);
      return values.length ? values.reduce((a,b) => a + b, 0) / values.length : null;
    };
    $("#c-avg-rpm").textContent = nf(mean('rpm_avg'),1);
    $("#c-avg-output").textContent = nf(mean('towels_per_hour'),1);
    $("#c-avg-eff").textContent = nf(mean('efficiency_pct'),1) + '%';
    const rows = d.rows.filter(r => inZone(r.loom)
      && ($("#ticket-filter").value !== "waiting" || r.awaiting_ticket));
    rows.sort((a,b) => Number(b.awaiting_ticket)-Number(a.awaiting_ticket) || (b.state_min||0)-(a.state_min||0));
    $("#grid").innerHTML = rows.map(card).join("") || '<p>Нет станков по выбранному фильтру.</p>';

    const run = rows.filter(r => r.state === "run").length;
    $("#c-run").textContent = run;
    $("#c-stop").textContent = rows.filter(r => r.state === "stop").length;
    $("#c-op").textContent = rows.filter(r => r.operator).length;
    $("#c-picks").textContent = Math.round(rows.reduce((s, r) => s + (r.picks_total || 0), 0));
    $("#head-sub").textContent = `${d.day.replace(/\./g,"/")}`
      + (d.shift ? ` · смена ${d.shift}` : "") + ` · станков ${rows.length}`;
    $("#foot").textContent = `${d.source === 'fact' ? 'Источник: FACT' : 'Источник: зеркало'} · ${d.stale ? 'ДАННЫЕ УСТАРЕЛИ' : 'возраст снимка: ' + nf(d.snapshot_age_sec) + ' с'}`
      + ` · тикет ждём со ${d.ticket_wait_min} мин простоя`
      + ' · Общие средние — по всем станкам с данными смены, включая стоящие (0 при отсутствии работы), без влияния фильтра. RPM станка = пики / минуты работы; выработка = полотенца / часы работы и простоя.'
      + ` · выработка и обрывы за ${d.day.replace(/\./g,"/")}`
      + (d.operators_from_fact ? ` · операторов из FACT: ${d.operators_from_fact}` : "");
  } catch (e) {
    $("#foot").textContent = "Сервер не ответил: " + e.message;
  }
}

$("#ticket-filter").onchange = load;
load();
/* Толчки с сервера: карточки перечитываются, как только поменялось состояние
   станков, а не раз в 20 секунд. Если поток оборвался — работаем опросом, пока
   браузер сам не переподключится. При разборе за прошлый день толкать нечего. */
let poll = null, pending = null;
const startPoll = () => { if (!poll) poll = setInterval(load, REFRESH); };
const stopPoll = () => { if (poll) { clearInterval(poll); poll = null; } };
if (!DAY && window.EventSource) {
  const es = new EventSource("/api/stream");
  es.addEventListener("board", () => {
    stopPoll();
    if (!pending) pending = setTimeout(() => { pending = null; load(); }, 600);
  });
  es.onerror = startPoll;
} else {
  startPoll();
}
</script>
